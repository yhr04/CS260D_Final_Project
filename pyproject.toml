[project]
name = "occprune"
version = "0.1.0"
description = "CS 260D final project: occlusion-aware gradient pruning for robust face verification"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch>=2.7,<2.10",
    "torchvision>=0.22,<0.25",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/occprune"]

# ---------------------------------------------------------------------------
# PyTorch wheels: CUDA 12.8 build on Windows/Linux (also runs on CPU-only
# machines), default PyPI build on macOS (MPS/CPU).
# ---------------------------------------------------------------------------
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]   # tests work without installing the package (pip / conda users)

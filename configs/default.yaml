# Train on CASIA-WebFace (112x112 aligned), test face verification on
# LFW (6000 pairs, standard 10 folds) with clean and occluded pairs.
# Read by occprune.pipeline (notebooks 01 / 02); every hyper-parameter lives here.

seed: 42                        # holdout-identity split seed AND training seed

data:
  webface_zip: data/_downloads/webface.zip   # kaggle: yakhyokhuja/webface-112x112
  val_zip: data/_downloads/val.zip           # kaggle: yakhyokhuja/agedb-30-calfw-cplfw-lfw-aligned-112x112
  cache_dir: data/cache                      # uint8 memmaps (git-ignored), ~18.5 GB for CASIA
  img_size: 112                              # native resolution, no resizing
  holdout_frac: 0.02                         # identities held out of training -> validation pairs
  holdout_min_images: 5                      # only identities with >= 5 images can be held out
  val_pairs_per_class: 3000                  # 3000 positive + 3000 negative pairs, 10 folds of 600
  test_sets: [lfw, agedb_30, calfw, cplfw]   # lfw is the main test set; others: clean accuracy only
  num_workers: 6                             # DataLoader workers reading the memmap

model:
  arch: resnet18                # ImageNet-pretrained torchvision ResNet-18 trunk
  embedding_dim: 512            # global pool -> FC(512, no bias) -> BN1d  (= model.fc)
  loss: cosface
  scale: 64.0                   # CosFace s
  margin: 0.35                  # CosFace m

occlusion:
  fill: 0.0
  train_prob: 0.5               # Dense-Aug: probability that a training image is occluded
  train_ratio: [0.10, 0.30]     # Dense-Aug: square patch area ~ U(0.10, 0.30) of the image
  val_ratios: [0.10, 0.30, 0.50]          # random squares on the 2nd image of each CASIA val pair
  test_ratios: [0.10, 0.30, 0.50]         # random squares on the 2nd image of each test pair
  test_regions: [eyes, mouth_nose, upper_half, lower_half]   # template-based, never seen in training
  val_seed: 1001
  test_seed: 2002
  diag_seed: 3003

train:
  epochs: 20
  batch_size: 256
  eval_batch_size: 512
  optimizer: sgd
  lr: 0.1                       # backbone, embedding layer and CosFace head
  momentum: 0.9
  weight_decay: 5.0e-4          # not applied to BatchNorm parameters or biases
  warmup_epochs: 1              # linear warm-up (new random head), then per-step cosine to 0
  amp: bf16                     # bf16 autocast for the trunk; CosFace logits in fp32. "none" = fp32
  channels_last: true
  hflip: true
  log_every: 200                # steps
  # Model selection (same rule for both models): epoch with the highest mean
  # verification accuracy on the held-out CASIA pairs over clean + val_ratios.
  # LFW is never used for selection.
  select_metric: val_mean_acc
  eval_flip: true               # embedding = normalise(f(x) + f(flip(x))), standard for LFW
  device: auto
  deterministic: true

prune:                          # read by occprune.prune_run (notebook 03); CLI / arguments override
  budget: 1024                  # calibration originals B (halves A / B of 512); every gradient method uses B views
  alpha: 0.5                    # OAGP weight on the occluded bank
  ft_epochs: 0                  # 0 = one-shot only
  ft_lr: 0.01                   # fine-tuning starts from a converged model: 10x below the dense lr
  ft_warmup_steps: 0            # then per-step cosine to 0
